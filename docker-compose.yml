version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fsis-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fsis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fsis_password}
      POSTGRES_DB: ${DB_NAME:-fsis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fsis-network
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fsis-server
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fsis}
      DB_USER: ${DB_USER:-fsis}
      DB_PASSWORD: ${DB_PASSWORD:-fsis_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
    depends_on:
      - postgres
    networks:
      - fsis-network
    restart: unless-stopped
    command: >
      sh -c "sleep 10 && npm run migrate && node dist/index.js"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: fsis-client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:3001}
    networks:
      - fsis-network
    restart: unless-stopped
    depends_on:
      - server

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fsis-cloudflared
    command: tunnel --hostname ${CF_TUNNEL_HOSTNAME:-devbry.online} --url http://client:80
    environment:
      CF_TUNNEL_HOSTNAME: ${CF_TUNNEL_HOSTNAME:-devbry.online}
    networks:
      - fsis-network
    restart: unless-stopped
    depends_on:
      - client

volumes:
  postgres_data:

networks:
  fsis-network:
    driver: bridge