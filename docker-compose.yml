services:
  postgres:
    image: postgres:16-alpine
    container_name: fsis-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fsis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fsis_password}
      POSTGRES_DB: ${DB_NAME:-fsis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fsis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fsis} -d ${DB_NAME:-fsis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fsis-server
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fsis}
      DB_USER: ${DB_USER:-fsis}
      DB_PASSWORD: ${DB_PASSWORD:-fsis_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsis-network
    restart: unless-stopped
    command: >
      sh -c "node dist/db/migrate.js && node dist/index.js"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: fsis-client
    ports:
      - "${CLIENT_PORT:-38080}:80"
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:3001}
    networks:
      - fsis-network
    restart: unless-stopped
    depends_on:
      - server

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fsis-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CF_TUNNEL_TOKEN}"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - client

  backup:
    image: postgres:16-alpine
    container_name: fsis-backup
    profiles: ["backup"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fsis}
      DB_USER: ${DB_USER:-fsis}
      DB_PASSWORD: ${DB_PASSWORD:-fsis_password}
    volumes:
      - ./backups:/backups
    networks:
      - fsis-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /backups
        STAMP=$$(date +%Y%m%d_%H%M%S)
        OUTFILE=/backups/fsis_backup_$${STAMP}.sql
        echo "Backing up database '$$DB_NAME'..."
        PGPASSWORD="$$DB_PASSWORD" pg_dump -h "$$DB_HOST" -p "$$DB_PORT" -U "$$DB_USER" -d "$$DB_NAME" > "$$OUTFILE"
        SIZE=$$(wc -c < "$$OUTFILE")
        echo "Backup created: $$OUTFILE ($$SIZE bytes)"
        # Keep only the newest 14 backups
        ls -1t /backups/fsis_backup_*.sql 2>/dev/null | tail -n +15 | while read -r old; do
          echo "  Deleting $$old"
          rm -f "$$old"
        done
        echo "Backup complete."

volumes:
  postgres_data:

networks:
  fsis-network:
    driver: bridge