services:
  postgres:
    image: postgres:16-alpine
    container_name: fsis-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-fsis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fsis_password}
      POSTGRES_DB: ${DB_NAME:-fsis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fsis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fsis} -d ${DB_NAME:-fsis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fsis-server
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fsis}
      DB_USER: ${DB_USER:-fsis}
      DB_PASSWORD: ${DB_PASSWORD:-fsis_password}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-me}
      BASE_URL: ${BASE_URL:-http://localhost:3001}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fsis-network
    restart: unless-stopped
    command: >
      sh -c "node dist/db/migrate.js && node dist/index.js"

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: fsis-client
    ports:
      - "${CLIENT_PORT:-38080}:80"
    environment:
      - BASE_URL=${BASE_URL:-http://localhost:3001}
    networks:
      - fsis-network
    restart: unless-stopped
    depends_on:
      - server

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fsis-cloudflared
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CF_TUNNEL_TOKEN}"]
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN:-}
    network_mode: host
    restart: unless-stopped
    depends_on:
      - client

volumes:
  postgres_data:

networks:
  fsis-network:
    driver: bridge